<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>魔法觉醒测试 - 测试结果</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container result-container">
        <header>
            <h1>⚡ 你的魔法类型 ⚡</h1>
        </header>
        
        <main>
            <div class="result-card" id="result-card">
                <div class="type-badge" id="type-badge">FNIM</div>
                <h2 id="type-name">自然唯心内敛型</h2>
                <p id="type-description">你的魔法类型描述将显示在这里...</p>
                
                <div class="traits">
                    <h3>核心特质</h3>
                    <div class="trait-list" id="trait-list">
                        <span class="trait">自然系</span>
                        <span class="trait">功能系</span>
                        <span class="trait">唯心魔法观</span>
                        <span class="trait">魔法内敛</span>
                    </div>
                </div>
            </div>
            
            <button class="awaken-btn" onclick="awakenMagic()">🔮 觉醒魔法</button>
            
            <button class="restart-btn" onclick="restartTest()">重新测试</button>
        </main>
        
        <footer>
            <p>© 2024 魔法觉醒测试 | 仅供娱乐参考</p>
        </footer>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
