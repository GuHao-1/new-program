<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MBTI性格测试</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>探索你的性格类型</h1>
            <p>通过这个测试，了解你的MBTI性格类型</p>
        </header>
        
        <main>
            <section class="intro">
                <h2>什么是MBTI？</h2>
                <p>MBTI（迈尔斯-布里格斯类型指标）是一种广泛使用的性格评估工具，帮助人们了解自己的性格偏好和行为模式。测试将根据你的选择，判断你属于16种性格类型中的哪一种。</p>
            </section>
            
            <section class="features">
                <div class="feature-card">
                    <h3>🔍 深入了解</h3>
                    <p>通过20道精心设计的问题，深入探索你的性格特质</p>
                </div>
                <div class="feature-card">
                    <h3>🎯 精准匹配</h3>
                    <p>基于荣格心理学理论，科学准确的性格分类</p>
                </div>
                <div class="feature-card">
                    <h3>📊 详细报告</h3>
                    <p>获取个性化的性格分析报告和发展建议</p>
                </div>
            </section>
            
            <button class="start-btn" onclick="startTest()">开始测试</button>
        </main>
        
        <footer>
            <p>© 2024 MBTI性格测试 | 仅供娱乐参考</p>
        </footer>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
