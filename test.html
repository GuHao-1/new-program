<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>魔法觉醒测试 - 测试进行中</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container test-container">
        <header>
            <div class="progress-bar">
                <div class="progress" id="progress"></div>
            </div>
            <p id="progress-text">第 1 / 4 题</p>
        </header>
        
        <main>
            <div class="question-card" id="question-card">
                <h2 id="question-text">题目加载中...</h2>
                <div class="options" id="options">
                    <button class="option-btn" id="opt-1" onclick="selectOption(0)">选项1</button>
                    <button class="option-btn" id="opt-2" onclick="selectOption(1)">选项2</button>
                    <button class="option-btn" id="opt-3" onclick="selectOption(2)">选项3</button>
                    <button class="option-btn" id="opt-4" onclick="selectOption(3)" style="display: none;">选项4</button>
                </div>
            </div>
            
            <div class="navigation">
                <button class="nav-btn" id="prev-btn" onclick="prevQuestion()" disabled>上一题</button>
                <button class="nav-btn" id="next-btn" onclick="nextQuestion()">下一题</button>
            </div>
        </main>
        
        <footer>
            <p>© 2024 魔法觉醒测试</p>
        </footer>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
